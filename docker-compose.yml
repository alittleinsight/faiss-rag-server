# docker-compose.yml
services:
  faiss-rag-server:
    container_name: faiss-rag-server
    build: .
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - RAG_USE_GPU=${RAG_USE_GPU:-true}
      - RAG_GPU_INDEX=${RAG_GPU_INDEX:-}
      - RAG_FAISS_INDEX_DEVICE=${RAG_FAISS_INDEX_DEVICE:-cpu}
      - RAG_FAISS_SEARCH_DEVICE=${RAG_FAISS_SEARCH_DEVICE:-gpu}
      - DEFAULT_FAISS_DIM=${DEFAULT_FAISS_DIM:-1024}
      #- CUDA_LAUNCH_BLOCKING=1
    volumes:
      - .:/workspace:cached
      - ../:/mounted/repo:ro
      - ../DocEx/temp:/mounted/temp:rw
      - ./documents:/workspace/documents
      - ./vectorstore:/workspace/vectorstore
    ports:
      - "8004:8004"  # Application port
      - "5678:5678"  # Debugger port
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint: >
      /bin/bash -c "
      echo '=== GPU Diagnostics ===';
      nvidia-smi;
      python -c 'import torch, faiss; \
      print(\"PyTorch sees\", torch.cuda.device_count(), \"GPUs\"); \
      print(\"FAISS sees\", faiss.get_num_gpus(), \"GPUs\")';      
      echo '=== Starting RAG server ===';
      exec uvicorn app:app --host 0.0.0.0 --port 8004
      "